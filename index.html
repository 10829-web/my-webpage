<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>지식 탐험대 - 메가 상식 퀴즈 마스터</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4 sm:p-6">

    <div class="w-full max-w-2xl bg-slate-900/90 backdrop-blur-xl border border-slate-800 rounded-3xl shadow-2xl p-6 sm:p-10 relative overflow-hidden my-auto">
        
        <!-- Background Glow Ornaments -->
        <div class="absolute -top-24 -right-24 w-48 h-48 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-24 -left-24 w-48 h-48 bg-purple-500/10 rounded-full blur-3xl pointer-events-none"></div>

        <!-- 1. Category Selection View -->
        <div id="categoryView" class="space-y-6 animate-fade">
            <div class="text-center space-y-2">
                <span class="bg-indigo-500/10 text-indigo-400 font-bold text-xs uppercase tracking-widest px-3 py-1.5 rounded-full border border-indigo-500/20">MEGA QUIZ DB (200+ Questions)</span>
                <h1 class="text-3xl sm:text-4xl font-extrabold text-white tracking-tight">상식 퀴즈 마스터</h1>
                <p class="text-slate-400 text-sm sm:text-base">분야별 대규모 데이터베이스에서 매번 랜덤으로 5문제가 출제됩니다!</p>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5 pt-2">
                <button onclick="startQuiz('history')" class="group p-5 bg-slate-800/60 hover:bg-indigo-600/20 border border-slate-700/60 hover:border-indigo-500/50 rounded-2xl text-left transition-all flex items-center gap-4">
                    <span class="text-3xl p-3 bg-indigo-500/10 rounded-xl group-hover:scale-110 transition-transform">🏛️</span>
                    <div>
                        <h3 class="font-bold text-slate-100 group-hover:text-indigo-300">역사</h3>
                        <p class="text-xs text-slate-400">한국 및 세계사 핵심 50제</p>
                    </div>
                </button>
                <button onclick="startQuiz('science')" class="group p-5 bg-slate-800/60 hover:bg-emerald-600/20 border border-slate-700/60 hover:border-emerald-500/50 rounded-2xl text-left transition-all flex items-center gap-4">
                    <span class="text-3xl p-3 bg-emerald-500/10 rounded-xl group-hover:scale-110 transition-transform">🔬</span>
                    <div>
                        <h3 class="font-bold text-slate-100 group-hover:text-emerald-300">과학</h3>
                        <p class="text-xs text-slate-400">우주, 물리, 생물 탐구 50제</p>
                    </div>
                </button>
                <button onclick="startQuiz('generals')" class="group p-5 bg-slate-800/60 hover:bg-amber-600/20 border border-slate-700/60 hover:border-amber-500/50 rounded-2xl text-left transition-all flex items-center gap-4">
                    <span class="text-3xl p-3 bg-amber-500/10 rounded-xl group-hover:scale-110 transition-transform">💡</span>
                    <div>
                        <h3 class="font-bold text-slate-100 group-hover:text-amber-300">일반상식</h3>
                        <p class="text-xs text-slate-400">시사, 경제, 상식 50제</p>
                    </div>
                </button>
                <button onclick="startQuiz('culture')" class="group p-5 bg-slate-800/60 hover:bg-pink-600/20 border border-slate-700/60 hover:border-pink-500/50 rounded-2xl text-left transition-all flex items-center gap-4">
                    <span class="text-3xl p-3 bg-pink-500/10 rounded-xl group-hover:scale-110 transition-transform">🎨</span>
                    <div>
                        <h3 class="font-bold text-slate-100 group-hover:text-pink-300">대중문화/예술</h3>
                        <p class="text-xs text-slate-400">영화, 음악, 미술, 문학 50제</p>
                    </div>
                </button>
            </div>
            
            <div class="pt-2">
                <button onclick="startQuiz('mixed')" class="w-full group p-5 bg-gradient-to-r from-indigo-900/40 to-purple-900/40 hover:from-indigo-600/30 hover:to-purple-600/30 border border-purple-500/30 rounded-2xl text-left transition-all flex items-center justify-between">
                    <div class="flex items-center gap-4">
                        <span class="text-3xl p-3 bg-purple-500/20 rounded-xl group-hover:scale-110 transition-transform">🔥</span>
                        <div>
                            <h3 class="font-bold text-white group-hover:text-purple-300 text-lg">전체 분야 혼합 모음</h3>
                            <p class="text-xs text-slate-300">모든 200문 중에서 무작위 5문제 출제</p>
                        </div>
                    </div>
                    <span class="text-purple-400 font-bold text-sm pr-2">시작하기 →</span>
                </button>
            </div>
        </div>

        <!-- 2. Quiz Session View -->
        <div id="quizView" class="hidden space-y-6 animate-fade">
            <!-- Header Progress -->
            <div class="flex items-center justify-between text-sm text-slate-400 border-b border-slate-800 pb-4">
                <span id="questionCategoryBadge" class="bg-indigo-500/10 text-indigo-400 font-semibold px-3 py-1 rounded-full text-xs border border-indigo-500/20">카테고리</span>
                <div class="flex items-center gap-4">
                    <span id="questionCounter">문제 1 / 5</span>
                    <span id="liveScore" class="font-bold text-emerald-400">점수: 0점</span>
                </div>
            </div>

            <!-- Question Box -->
            <div class="space-y-3">
                <h2 id="questionText" class="text-xl sm:text-2xl font-bold text-white leading-snug">질문이 여기에 표시됩니다.</h2>
            </div>

            <!-- Options List -->
            <div id="optionsContainer" class="space-y-3 pt-2">
                <!-- Dynamically populated options -->
            </div>

            <!-- Feedback & Next Action -->
            <div id="feedbackContainer" class="hidden pt-2 flex items-center justify-between bg-slate-800/80 p-4 rounded-2xl border border-slate-700/80">
                <p id="feedbackText" class="font-semibold text-sm"></p>
                <button onclick="nextQuestion()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-5 py-2.5 rounded-xl transition-all shadow-lg shadow-indigo-600/20 text-sm">
                    다음 문제 →
                </button>
            </div>
        </div>

        <!-- 3. Result Card View -->
        <div id="resultView" class="hidden space-y-6 animate-fade">
            <div class="text-center space-y-2">
                <div class="w-20 h-20 bg-indigo-500/10 border border-indigo-500/30 rounded-3xl flex items-center justify-center mx-auto text-4xl shadow-inner mb-4">
                    🏆
                </div>
                <h2 class="text-2xl sm:text-3xl font-extrabold text-white">퀴즈 완료!</h2>
                <p class="text-slate-400 text-sm">모든 문제를 풀었습니다. 최종 결과와 오답노트를 확인하세요.</p>
            </div>

            <!-- Score Badge Card -->
            <div class="bg-slate-800/60 border border-slate-700/60 rounded-3xl p-6 space-y-4 max-w-sm mx-auto shadow-xl">
                <div>
                    <span class="text-xs text-slate-400 font-semibold uppercase tracking-wider">최종 점수</span>
                    <div id="finalScoreDisplay" class="text-4xl font-extrabold text-indigo-400 mt-1">80점</div>
                </div>
                <div class="border-t border-slate-700/60 pt-4 flex justify-around text-center">
                    <div>
                        <span class="text-xs text-slate-400">정답 개수</span>
                        <div id="correctCountDisplay" class="text-lg font-bold text-emerald-400 mt-0.5">4 / 5</div>
                    </div>
                    <div class="border-r border-slate-700/60"></div>
                    <div>
                        <span class="text-xs text-slate-400">등급</span>
                        <div id="gradeDisplay" class="text-lg font-bold text-amber-400 mt-0.5">우수 (A)</div>
                    </div>
                </div>
            </div>

            <!-- Wrong Notes Container -->
            <div id="wrongNotesSection" class="space-y-3 pt-2">
                <h3 class="font-bold text-white text-base border-b border-slate-800 pb-2 flex items-center justify-between">
                    <span>📖 오답 노트</span>
                    <span id="wrongCountBadge" class="text-xs bg-rose-500/20 text-rose-400 px-2.5 py-1 rounded-full border border-rose-500/30">틀린 문제 0개</span>
                </h3>
                <div id="wrongNotesList" class="space-y-2 max-h-60 overflow-y-auto pr-1">
                    <!-- Populated dynamically -->
                </div>
            </div>

            <!-- Restart Button -->
            <div class="pt-2">
                <button onclick="resetQuiz()" class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-bold py-4 rounded-2xl transition-all shadow-xl shadow-indigo-600/20 active:scale-95 text-base">
                    🔄 처음으로 돌아가기
                </button>
            </div>
        </div>

    </div>

    <script>
        // Massive Quiz Database: 50 items per category (Total 200+ questions)
        const quizDatabase = {
            history: [
                { q: "조선 제4대 왕으로 훈민정음을 창제한 왕은?", options: ["태조", "세종대왕", "정조", "영조"], answer: 1 },
                { q: "임진왜란 중 이순신 장군이 13척의 배로 대승을 거둔 해전은?", options: ["명량대첩", "한산도대첩", "노량해전", "당포해전"], answer: 0 },
                { q: "1919년 3월 1일 일어난 독립만세 운동은?", options: ["6·10만세운동", "3·1운동", "광주학생항일운동", "물산장려운동"], answer: 1 },
                { q: "로마 제국의 초대 황제는?", options: ["시저", "아우구스투스", "네로", "콘스탄티누스"], answer: 1 },
                { q: "프랑스 대혁명이 발발한 연도는?", options: ["1789년", "1592년", "1910년", "1492년"], answer: 0 },
                { q: "고려를 건국한 왕건이 세운 건국 연도는?", options: ["918년", "936년", "1392년", "698년"], answer: 0 },
                { q: "신라의 삼국 통일에 크게 기여한 화랑 출신의 장군은?", options: ["계백", "김유신", "을지문덕", "연개소문"], answer: 1 },
                { q: "발해를 건국한 왕은?", options: ["대조영", "왕건", "주몽", "근초고왕"], answer: 0 },
                { q: "조선 후기 실학자 중 '학민원' 및 '목민심서'를 저술한 인물은?", options: ["정약용", "이익", "박지원", "홍대용"], answer: 0 },
                { q: "미국의 독립 선언문이 발표된 연도는?", options: ["1776년", "1812년", "1865년", "1901년"], answer: 0 },
                { q: "발명가 토머스 에디슨이 백열전구를 발명한 세기는?", options: ["18세기", "19세기", "20세기", "17세기"], answer: 1 },
                { q: "조선시대 왕의 비밀 감찰 기구로 유명했던 기관은?", options: ["의금부", "암행어사", "성균관", "집현전"], answer: 1 },
                { q: "조선시대 신문고를 처음 설치한 왕은?", options: ["태종", "세종", "영조", "정조"], answer: 0 },
                { q: "청일전쟁의 결과 체결된 불평등 조약의 이름은?", options: ["시모노세키 조약", "을사조약", "강화도조약", "포츠머스 조약"], answer: 0 },
                { q: "제1차 세계대전이 발발한 연도는?", options: ["1914년", "1939년", "1905년", "1925년"], answer: 0 },
                { q: "제2차 세계대전이 종료된 연도는?", options: ["1945년", "1950년", "1918년", "1960년"], answer: 0 },
                { q: "조선 제22대 왕으로 수원 화성을 건립한 개혁 군주는?", options: ["정조", "영조", "숙종", "광해군"], answer: 0 },
                { q: "고구려 을지문덕 장군이 수나라 군대를 대파한 전투는?", options: ["살수대첩", "안시성전투", "매소성전투", "황산벌전투"], answer: 0 },
                { q: "백제의 성왕이 도읍을 옮긴 곳으로, 사비 시대의 중심지는?", options: ["부여", "공주", "익산", "서울"], answer: 0 },
                { q: "한국사에서 최초의 국가로 인정받는 청동기 문화 국가는?", options: ["고조선", "부여", "옥저", "동예"], answer: 0 },
                { q: "고려시대 팔만대장경을 국난 극복을 위해 보관한 사찰은?", options: ["해인사", "불국사", "통도사", "화엄사"], answer: 0 },
                { q: "조선시대 임진왜란 중 옥포해전이 벌어진 연도는?", options: ["1592년", "1597년", "1593년", "1600년"], answer: 0 },
                { q: "독일의 베를린 장벽이 무너진 연도는?", options: ["1989년", "1975년", "1991년", "1980년"], answer: 0 },
                { q: "소련의 마지막 서기장이자 개혁(페레스트로이카)을 이끈 인물은?", options: ["고르바초프", "스탈린", "레닌", "푸틴"], answer: 0 },
                { q: "영국의 명예혁명이 일어난 세기는?", options: ["17세기", "16세기", "18세기", "19세기"], answer: 0 },
                { q: "콜럼버스가 아메리카 대륙을 처음 발견한 연도는?", options: ["1492년", "1500년", "1453년", "1510년"], answer: 0 },
                { q: "조선시대 훈구파에 대항하여 사림파가 등용되는 계기가 된 사화가 아닌 것은?", options: ["갑자사화", "무오사화", "기묘사화", "임진사화"], answer: 3 },
                { q: "대한민국 임시정부가 수립된 해는?", options: ["1919년", "1945년", "1910년", "1948년"], answer: 0 },
                { q: "조선시대 광해군이 실시한 중립 외교의 핵심 내용으로 알맞은 것은?", options: ["명과 후금 사이의 중립 외교", "청나라와의 전면전", "일본과의 국교 단절", "미국과의 통상 수교"], answer: 0 },
                { q: "한국전쟁(6·25 전쟁)이 발발한 날짜는?", options: ["1950년 6월 25일", "1953년 7월 27일", "1945년 8월 15일", "1948년 8월 15일"], answer: 0 },
                { q: "고려 광종이 노비들의 해방을 위해 실시한 개혁 정책은?", options: ["노비안검법", "과전법", "전시과", "공민왕의 개혁"], answer: 0 },
                { q: "발해의 최고 전성기를 이끌며 '해동성국'이라 불린 왕은?", options: ["문왕", "무왕", "선왕", "대조영"], answer: 2 },
                { q: "신라 진흥왕 때 영토 확장과 인재 양성을 위해 만든 청소년 조직은?", options: ["화랑도", "배달국", "조선청년단", "국학"], answer: 0 },
                { q: "조선시대 의병장 중 행주대첩을 승리로 이끈 장군은?", options: ["권율", "이순신", "곽재우", "김시민"], answer: 0 },
                { q: "고려시대 몽골과의 항전 과정에서 만들어진 대장경은?", options: ["팔만대장경", "초조대장경", "속장경", "교장"], answer: 0 },
                { q: "조선 세조 때 집필되기 시작하여 완성된 종합 법전은?", options: ["경국대전", "경국대전을 보완한 속대전", "대전회통", "속오법"], answer: 0 },
                { q: "삼국시대 중 가장 먼저 중앙 집권 체제를 확립한 국가는?", options: ["백제", "고구려", "신라", "가야"], answer: 0 },
                { q: "조선시대 실학자 중 북학파에 속하며 '열하일기'를 쓴 인물은?", options: ["박지원", "정약용", "이익", "유형원"], answer: 0 },
                { q: "중국 오랫동안 분열되어 있던 진나라를 통일한 최초의 황제는?", options: ["진시황", "한고조", "측천무후", "한무제"], answer: 0 },
                { q: "고대 이집트 문명이 발달한 강은?", options: ["나일강", "티그리스강", "유프라테스강", "황하강"], answer: 0 },
                { q: "메소포타미아 문명에서 사용된 세계 최초의 문자는?", options: ["설형문자(쐐기문자)", "상형문자", "알파벳", "한자"], answer: 0 },
                { q: "고대 그리스의 철학자로 소크라테스의 제자는?", options: ["플라톤", "아리스토텔레스", "피타고라스", "헤로도토스"], answer: 0 },
                { q: "1215년 영국의 왕이 귀한들의 압력으로 서명한 민주주의의 기초가 된 문서는?", options: ["마그나 카르타(대헌장)", "인권선언문", "권리장전", "독립선언서"], answer: 0 },
                { q: "조선시대 흥선대원군이 쇄국정책을 펼치며 세운 척화비의 건립 장소는?", options: ["전국 각지의 요충지", "경복궁 정문", "종묘 앞", "한성부 청사"], answer: 0 },
                { q: "1945년 해방 직후 한반도의 신탁통치를 결정하기 위해 열린 회의는?", options: ["모스크바 삼상회의", "얄타회담", "포츠담회담", "카이로회담"], answer: 0 },

        };

        let currentCategory = '';
        let currentQuestions = [];
        let currentIndex = 0;
        let score = 0;
        let correctCount = 0;
        let isAnswered = false;
        let userMistakes = [];

        function startQuiz(category) {
            currentCategory = category;
            
            let pool = [];
            if (category === 'mixed') {
                pool = [...quizDatabase.history, ...quizDatabase.science, ...quizDatabase.generals, ...quizDatabase.culture];
            } else {
                pool = [...quizDatabase[category]];
            }

            // Shuffle and pick 5 random questions
            currentQuestions = pool.sort(() => Math.random() - 0.5).slice(0, 5);
            
            currentIndex = 0;
            score = 0;
            correctCount = 0;
            userMistakes = [];

            document.getElementById('categoryView').classList.add('hidden');
            document.getElementById('quizView').classList.remove('hidden');
            document.getElementById('resultView').classList.add('hidden');

            loadQuestion();
        }

        function loadQuestion() {
            isAnswered = false;
            const qData = currentQuestions[currentIndex];
            
            const categoryNames = { history: '역사', science: '과학', generals: '일반상식', culture: '대중문화/예술', mixed: '전체 분야 혼합' };
            document.getElementById('questionCategoryBadge').innerText = categoryNames[currentCategory];
            document.getElementById('questionCounter').innerText = `문제 ${currentIndex + 1} / ${currentQuestions.length}`;
            document.getElementById('liveScore').innerText = `점수: ${score}점`;
            document.getElementById('questionText').innerText = qData.q;
            document.getElementById('feedbackContainer').classList.add('hidden');

            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';

            qData.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-4 rounded-2xl bg-slate-800/80 hover:bg-slate-700/80 border border-slate-700/80 text-slate-200 font-medium transition-all flex items-center justify-between group cursor-pointer";
                btn.innerHTML = `
                    <span class="flex items-center gap-3">
                        <span class="w-7 h-7 rounded-xl bg-slate-700 text-slate-300 font-bold text-xs flex items-center justify-center group-hover:bg-indigo-600 group-hover:text-white transition-colors">${idx + 1}</span>
                        ${opt}
                    </span>
                `;
                btn.onclick = () => selectAnswer(idx, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function selectAnswer(selectedIdx, btnElement) {
            if (isAnswered) return;
            isAnswered = true;

            const qData = currentQuestions[currentIndex];
            const options = document.getElementById('optionsContainer').children;
            const feedbackContainer = document.getElementById('feedbackContainer');
            const feedbackText = document.getElementById('feedbackText');

            if (selectedIdx === qData.answer) {
                btnElement.className = "w-full text-left p-4 rounded-2xl bg-emerald-500/20 border border-emerald-500/50 text-emerald-300 font-medium flex items-center justify-between shadow-lg shadow-emerald-500/10";
                score += 20;
                correctCount += 1;
                feedbackText.innerHTML = "🎉 정답입니다! 완벽해요!";
                feedbackText.className = "font-semibold text-sm text-emerald-400";
            } else {
                btnElement.className = "w-full text-left p-4 rounded-2xl bg-rose-500/20 border border-rose-500/50 text-rose-300 font-medium flex items-center justify-between";
                options[qData.answer].className = "w-full text-left p-4 rounded-2xl bg-emerald-500/20 border border-emerald-500/50 text-emerald-300 font-medium flex items-center justify-between";
                feedbackText.innerHTML = `❌ 아쉽네요! 정답은 '${qData.options[qData.answer]}' 입니다.`;
                feedbackText.className = "font-semibold text-sm text-rose-400";

                // Save to mistakes
                userMistakes.push({
                    question: qData.q,
                    userAnswer: qData.options[selectedIdx],
                    correctAnswer: qData.options[qData.answer]
                });
            }

            // Disable all options after selection
            for (let opt of options) {
                opt.style.pointerEvents = 'none';
            }

            document.getElementById('liveScore').innerText = `점수: ${score}점`;
            feedbackContainer.classList.remove('hidden');
        }

        function nextQuestion() {
            currentIndex++;
            if (currentIndex < currentQuestions.length) {
                loadQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById('quizView').classList.add('hidden');
            document.getElementById('resultView').classList.remove('hidden');

            document.getElementById('finalScoreDisplay').innerText = `${score}점`;
            document.getElementById('correctCountDisplay').innerText = `${correctCount} / ${currentQuestions.length}`;

            let grade = "수 (A)";
            if (score === 100) grade = "천재 (S+)";
            else if (score >= 80) grade = "우수 (A)";
            else if (score >= 60) grade = "보통 (B)";
            else if (score >= 40) grade = "노력 요망 (C)";
            else grade = "분발 필요 (D)";

            document.getElementById('gradeDisplay').innerText = grade;

            // Render Wrong Notes
            const wrongNotesList = document.getElementById('wrongNotesList');
            const wrongCountBadge = document.getElementById('wrongCountBadge');
            wrongNotesList.innerHTML = '';
            wrongCountBadge.innerText = `틀린 문제 ${userMistakes.length}개`;

            if (userMistakes.length === 0) {
                wrongNotesList.innerHTML = `
                    <div class="p-4 bg-emerald-500/10 border border-emerald-500/20 rounded-2xl text-center text-emerald-300 text-sm font-medium">
                        🎉 틀린 문제가 없습니다! 만점을 축하합니다!
                    </div>
                `;
            } else {
                userMistakes.forEach((item, idx) => {
                    const div = document.createElement('div');
                    div.className = "p-4 bg-slate-800/80 border border-slate-700/80 rounded-2xl space-y-1.5 text-sm";
                    div.innerHTML = `
                        <p class="font-bold text-white">Q. ${item.question}</p>
                        <div class="flex flex-wrap gap-x-4 text-xs pt-1">
                            <span class="text-rose-400">내 답변: <strong>${item.userAnswer}</strong></span>
                            <span class="text-emerald-400">정답: <strong>${item.correctAnswer}</strong></span>
                        </div>
                    `;
                    wrongNotesList.appendChild(div);
                });
            }
        }

        function resetQuiz() {
            document.getElementById('resultView').classList.add('hidden');
            document.getElementById('categoryView').classList.remove('hidden');
        }
    </script>
</body>
</html>
